<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SiteManager</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
    background: #f5f5f5;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

input, button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
}

button {
    cursor: pointer;
}

.result {
    margin-top: 15px;
}

.buttons {
    display: flex;
    gap: 5px;
}

.buttons button {
    flex: 1;
}

#infoBox {
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-line;
    background: #eee;
    padding: 10px;
    margin-top: 10px;
    display: none;
}
</style>
</head>

<body>

<div class="container">

<h2>📡 SiteManager</h2>

<input id="search" placeholder="Digite o site">

<button onclick="buscar()">Buscar</button>

<div class="result">
<p id="tecnico"></p>
<p id="area"></p>
<p id="endereco"></p>
</div>

<div class="buttons">
<button onclick="dirigir()">Dirigir</button>
<button onclick="mostrarInfo()">Info</button>
<button onclick="resetar()">Reset</button>
</div>

<button onclick="maisProximo()">📍 Site Mais Próximo</button>

<div id="infoBox"></div>

<p style="margin-top:20px;font-size:12px;text-align:center;">
Sistema em testes<br>
Marcelo Isaias dos Santos - SPC3
</p>

</div>

<script>

let dados = [];
let siteAtual = null;

// 🔹 CARREGA JSON
fetch('sites_clean3.json')
.then(res => res.json())
.then(json => {
    dados = json;
});

// 🔍 BUSCAR
function buscar() {
    let nome = document.getElementById("search").value.trim().toUpperCase();

    siteAtual = dados.find(s => s.site.toUpperCase() === nome);

    if (siteAtual) {
        document.getElementById("tecnico").innerText = "Técnico: " + (siteAtual.Tecnico || "");
        document.getElementById("area").innerText = "Área: " + (siteAtual.Area || "");
        document.getElementById("endereco").innerText = "Endereço: " + (siteAtual.endereco || "");
    } else {
        document.getElementById("tecnico").innerText = "Não encontrado";
        document.getElementById("area").innerText = "";
        document.getElementById("endereco").innerText = "";
    }
}

// 🧭 DIRIGIR
function dirigir() {
    if (!siteAtual) return;

    let url = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(siteAtual.endereco);
    window.open(url, "_blank");
}

// ℹ️ INFO
function mostrarInfo() {
    if (!siteAtual) return;

    let info = "";

    for (let key in siteAtual) {
        if (siteAtual[key] && siteAtual[key] !== "") {
            info += key + ": " + siteAtual[key] + "\n\n";
        }
    }

    info += "\n---\nSiteManager\nMarcelo Isaias dos Santos\n";

    let box = document.getElementById("infoBox");
    box.style.display = "block";
    box.innerText = info;
}

// 🔄 RESET
function resetar() {
    document.getElementById("search").value = "";
    document.getElementById("tecnico").innerText = "";
    document.getElementById("area").innerText = "";
    document.getElementById("endereco").innerText = "";
    document.getElementById("infoBox").style.display = "none";
    siteAtual = null;
}

// 📍 GPS
function maisProximo() {
    if (!navigator.geolocation) {
        alert("GPS não suportado");
        return;
    }

    navigator.geolocation.getCurrentPosition(pos => {
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;

        let menor = Infinity;
        let melhor = null;

        dados.forEach(s => {
            let sLat = parseFloat(s.latitude);
            let sLon = parseFloat(s.longitude);

            if (!sLat || !sLon) return;

            let dist = distancia(lat, lon, sLat, sLon);

            if (dist < menor) {
                menor = dist;
                melhor = s;
            }
        });

        if (melhor) {
            siteAtual = melhor;
            document.getElementById("tecnico").innerText = "Técnico: " + (melhor.Tecnico || "");
            document.getElementById("area").innerText = "Área: " + (melhor.Area || "");
            document.getElementById("endereco").innerText = "Endereço: " + (melhor.endereco || "");
        }
    });
}

// 📏 DISTÂNCIA
function distancia(lat1, lon1, lat2, lon2) {
    let R = 6371;
    let dLat = (lat2 - lat1) * Math.PI/180;
    let dLon = (lon2 - lon1) * Math.PI/180;

    let a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI/180) *
        Math.cos(lat2 * Math.PI/180) *
        Math.sin(dLon/2) * Math.sin(dLon/2);

    let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

    return R * c;
}

</script>

</body>
</html>
