<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>SiteManager</title>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>

    body {
        font-family: Arial;
        padding: 20px;
        background: #f5f5f5;
    }

    .container {
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
    }

    input, button {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
    }

    button {
        cursor: pointer;
    }

    .result {
        margin-top: 15px;
    }

    .buttons {
        display: flex;
        gap: 5px;
    }

    .buttons button {
        flex: 1;
    }

    #infoBox {
        max-height: 300px;
        overflow-y: auto;
        white-space: pre-line;
        background: #eee;
        padding: 10px;
        margin-top: 10px;
        display: none;
    }

    </style>

</head>

<body>

<body>

<div class="container">

<h1>SiteManager</h1>

<input
    type="text"
    id="siteInput"
    list="listaSites"
    placeholder="Digite o nome do site"
/>

<datalist id="listaSites"></datalist>

<div class="buttons">

<button onclick="buscarSite()">
    Buscar
</button>

<button onclick="dirigir()">
    Dirigir
</button>

<button onclick="info()">
    Informações
</button>

<button onclick="resetar()">
    Reset
</button>

</div>

<hr>

<div class="result">

<p id="tecnico"></p>
<p id="area"></p>
<p id="endereco"></p>

</div>

</div>

    <!----------- SCRIPT -->

<script>

let sites = [];

async function carregarDados() {

    const url =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vTEQpZbRDkEa41zRYcY-kUqjobz3Ex4KVLVuQZg4f_mMQZGGjQ752n843gr2J2HdgrjwnsduJJr8VP3/pubhtml";

    const resposta = await fetch(url);

    const csv = await resposta.text();

    const resultado = Papa.parse(csv, {
        header: true,
        skipEmptyLines: true
    });

    sites = resultado.data;

    configurarAutocomplete();
}

function configurarAutocomplete() {

    const datalist =
        document.getElementById("listaSites");

    datalist.innerHTML = "";

    sites.forEach(site => {

        if (!site.site) return;

        const option =
            document.createElement("option");

        option.value = site.site;

        datalist.appendChild(option);
    });
}

function buscarSite() {

    const nome = document
        .getElementById("siteInput")
        .value
        .trim()
        .toUpperCase();

    const site = sites.find(
        s => s.site?.toUpperCase() === nome
    );

    if (!site) {

        alert("Site não encontrado");
        return;
    }

    document.getElementById("tecnico").innerText =
        "Técnico: " + (site.tecnico || "");

    document.getElementById("area").innerText =
        "Área: " + (site.area || "");

    document.getElementById("endereco").innerText =
        "Endereço: " + (site.endereco || "");

    window.siteAtual = site;
}

function dirigir() {

    if (!window.siteAtual) return;

    let url = "";

    if (
        window.siteAtual.latitude &&
        window.siteAtual.longitude
    ) {

        url =
            "https://www.google.com/maps?q=" +
            window.siteAtual.latitude +
            "," +
            window.siteAtual.longitude;

    } else {

        url =
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(
                window.siteAtual.endereco
            );
    }

    window.open(url, "_blank");
}

function info() {

    if (!window.siteAtual) return;

    let texto = "";

    Object.keys(window.siteAtual).forEach(chave => {

        let valor = window.siteAtual[chave];

        if (valor && valor !== "0") {

            texto +=
                "<b>" +
                chave.toUpperCase() +
                ":</b> " +
                valor +
                "<br><br>";
        }
    });

    document.getElementById("janelaInfoTexto")
        .innerHTML = texto;

    document.getElementById("janelaInfo")
        .style.display = "block";
}

function resetar() {

    document.getElementById("siteInput").value = "";

    document.getElementById("tecnico").innerText = "";
    document.getElementById("area").innerText = "";
    document.getElementById("endereco").innerText = "";

    window.siteAtual = null;
}

carregarDados();

</script>

<div id="janelaInfo"
     style="
        display:none;
        position:fixed;
        top:5%;
        left:5%;
        width:90%;
        height:85%;
        background:white;
        border:1px solid #999;
        padding:20px;
        overflow:auto;
        z-index:9999;
        box-shadow:0 0 15px rgba(0,0,0,0.4);
">

    <button onclick="
        document.getElementById('janelaInfo')
        .style.display='none';
    ">
        Fechar
    </button>

    <hr>

    <div id="janelaInfoTexto"></div>

</div>

</body>

</html>
